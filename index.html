:root{--bg:#eef0f4;--surface:#fff;--text:#141b2d;--muted:#5b667a;--brand:#12306b;--accent:#f5b400;--line:#e1e5ee;--foot:#0d1b3d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b101d;--surface:#151d31;--text:#e8edf6;--muted:#9fb0cc;--brand:#8fb4ff;--line:#26314d;--foot:#070b15}}
:root[data-theme="dark"]{--bg:#0b101d;--surface:#151d31;--text:#e8edf6;--muted:#9fb0cc;--brand:#8fb4ff;--line:#26314d;--foot:#070b15}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans Lao','Noto Sans Thai','Swei Gothic','PingFang TC','Microsoft JhengHei','PingFang SC','Microsoft YaHei','Noto Sans SC','Phetsarath OT',Tahoma,sans-serif;line-height:1.75}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header{background:var(--surface);border-bottom:3px solid var(--accent);position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
header .wrap{display:flex;align-items:center;gap:12px;padding-top:9px;padding-bottom:9px;flex-wrap:wrap}
.logo{font-weight:800;color:var(--brand);font-size:1.1rem;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--text);text-decoration:none;font-weight:700;font-size:.88rem;padding:5px 10px;border-radius:8px}
nav a:hover{background:var(--bg);color:var(--brand)}
.lang{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{font:inherit;font-size:.82rem;border:0;background:transparent;color:var(--text);padding:2px 10px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--surface);font-weight:700}
.skin{border:1px solid var(--line);background:var(--bg);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:1rem}
.feat{display:grid;gap:14px;grid-template-columns:2fr 1fr;margin-top:18px}
.big{position:relative;min-height:390px;border-radius:14px;overflow:hidden;background:var(--brand);display:flex;align-items:flex-end}
.big .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.big:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,20,50,.93) 10%,rgba(8,20,50,.1) 75%)}
.ov{position:relative;z-index:1;color:#fff;padding:26px}
.ov h1{margin:0 0 8px;font-size:clamp(1.6rem,4.5vw,2.4rem);line-height:1.35}
.ov h1 span{color:var(--accent)}
.ov p{margin:0 0 16px;opacity:.95;max-width:540px}
.btn{display:inline-block;background:var(--accent);color:#14213d;padding:10px 22px;border-radius:999px;font-weight:700;text-decoration:none}
.side{display:grid;gap:14px;grid-template-rows:auto 1fr}
.promo{background:var(--surface);border-radius:14px;padding:18px;text-align:center;border:3px solid var(--accent)}
.promo .off{display:inline-block;background:#d62828;color:#fff;font-weight:700;border-radius:8px;padding:1px 12px;margin-bottom:4px}
.promo .price{font-size:1.7rem;font-weight:800;color:#d62828;line-height:1.3}
.promo small{color:var(--muted)}
.kidscard{background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:10px;border:1px solid var(--line)}
.kidscard img{max-height:190px;max-width:100%;width:auto;height:auto}
section{padding:14px 0}
section>.wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
h2{font-size:1.35rem;margin:0 0 6px;padding-left:12px;border-left:5px solid var(--accent);line-height:1.4}
.sub{color:var(--muted);margin:0 0 20px;padding-left:17px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:16px;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.card h3{margin:0 0 6px;font-size:1.03rem;color:var(--brand);line-height:1.5}
.card p{margin:0;color:var(--muted);font-size:.94rem}
.vision{border-left:6px solid var(--accent);background:var(--bg);border-radius:10px;padding:16px 20px;font-size:1.08rem;font-weight:700;margin-bottom:16px}
.facts .card{text-align:center}
.facts b{display:block;font-size:1.25rem;color:var(--brand)}
.facts span{color:var(--muted);font-size:.9rem}
.club{display:flex;gap:12px;align-items:flex-start}
.club i{font-style:normal;font-size:1.5rem;line-height:1.3}
.cta{margin-top:18px;padding:14px 18px;border-radius:10px;background:var(--brand);color:#fff;font-weight:600}
[data-theme="dark"] .cta{color:#0b101d}
footer{background:var(--foot);color:#fff;padding:26px 0;margin-top:18px;font-size:.92rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center}
.soc a{color:#fff;text-decoration:none;font-weight:600;margin-left:14px;border-bottom:2px solid var(--accent)}
@media(max-width:820px){.feat{grid-template-columns:1fr}.big{min-height:330px}}
.card{position:relative}.card a.stretch{color:var(--brand);font-weight:700;text-decoration:underline;text-underline-offset:3px}.card a.stretch::after{content:"";position:absolute;inset:0;border-radius:10px}.card:has(a.stretch){cursor:pointer}
[hidden]{display:none!important}.back{display:inline-block;margin-bottom:12px;color:var(--brand);font-weight:700;text-decoration:none}.news-list{display:grid;gap:12px}.item{display:block}.badge{display:inline-block;font-weight:700;font-size:.78rem;border-radius:6px;padding:0 9px;margin-bottom:6px;color:#fff}.badge.a{background:#d97706}.badge.n{background:#2b6cb0}.badge.c{background:#2f9e6b}
.admin label{display:block;font-weight:700;margin:12px 0 4px}.admin input,.admin select,.admin textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}.admin textarea{min-height:90px}.admin button{font:inherit;font-weight:700;padding:8px 16px;border-radius:999px;border:0;background:var(--brand);color:var(--surface);cursor:pointer;margin:10px 8px 0 0}.admin button.sec{background:var(--bg);color:var(--text);border:1px solid var(--line)}.admin details{margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:6px 12px}.arow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:8px 0}.arow b{flex:1;min-width:180px}.arow button{margin:0;padding:3px 12px}.nimg{max-width:100%;max-height:280px;border-radius:10px;display:block;margin:8px 0}.nbody{white-space:pre-line}.when{color:var(--muted);margin-left:8px}.msg{margin-top:10px;font-weight:700}
</style></head><body>

<h2>ກ່ຽວກັບໂຮງຮຽນ</h2>
<p class="sub">ຮຽນຮູ້ · ເຕີບໃຫຍ່ · ເຄົາລົບ · ປະສົບຜົນສຳເລັດ</p>
<p>ດ້ວຍປະສົບການການສ້າງໂຮງຮຽນເອື້ອຍໜູນ້ອຍມາດົນກວ່າ 10 ປີ ໂຮງຮຽນປາໂລມາ ເປັນໂຮງຮຽນໃໝ່ທີ່ຮັບຮອງການຮຽນຮູ້ທີ່ທັນສະໄໝໃນຫຼວງພະບາງ ມຸ່ງໝັ້ນທີ່ຈະຊ່ວຍໃຫ້ເດັກນ້ອຍເຕີບໃຫຍ່ທັງດ້ານວິຊາການ ສັງຄົມ ແລະ ສ່ວນບຸກຄົນ.</p>
<p>ພວກເຮົາລວບລວມຄູທ້ອງຖິ່ນ ແລະ ຄູຕ່າງປະເທດທີ່ມີຄວາມເອົາໃຈໃສ່ ວິທີການສອນທີ່ທັນສະໄໝ ເຕັກໂນໂລຢີ ຄວາມຄິດສ້າງສັນ ແລະ ການຮຽນຮູ້ແບບມີສ່ວນຮ່ວມ (Active Learning) ເພື່ອສ້າງສະພາບແວດລ້ອມທີ່ເຮັດໃຫ້ເດັກທຸກຄົນຮູ້ສຶກໄດ້ຮັບການສະໜັບສະໜູນ ມີຄວາມໝັ້ນໃຈ ແລະ ມີແຮງບັນດານໃຈໃນການຮຽນຮູ້.</p>

<h2>ວິໄສທັດ ແລະ ພາລະກິດ</h2>
<div class="vision">ສອນຢ່າງໃສ່ໃຈ ຮຽນຢ່າງສ້າງສັນ ທັນສູ່ວັດທະນະທຳດີເດັ່ນ ຄິດວິເຄາະເປັນ ເນັ້ນມາລະຍາດດີ ມີຄວາມທັນສະໄໝ ກ້າວໄກສູ່ສາກົນ</div>
